<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<style>
@font-face{font-family:"Patrick Hand";src:url("fonts/PatrickHand-Regular.ttf") format("truetype")}
html,body{margin:0;background:#f1e9df} svg{display:block} text{font-family:"Patrick Hand",cursive}
</style>
<script src="vendor/rough.js"></script>
</head><body>
<svg id="s" width="1080" height="1920" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
 <defs>
  <radialGradient id="vig" cx="50%" cy="45%" r="75%"><stop offset="0" stop-color="#f5efe6"/><stop offset=".7" stop-color="#eee5d9"/><stop offset="1" stop-color="#dfd3c4"/></radialGradient>
  <filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="7"/><feColorMatrix values="0 0 0 0 0.35  0 0 0 0 0.3  0 0 0 0 0.25  0 0 0 0.07 0"/></filter>
 </defs>
 <rect width="1080" height="1920" fill="url(#vig)"/>
 <g transform="translate(540,1000) scale(1.15) translate(-540,-1000)"><g id="stage"></g></g>
 <rect width="1080" height="1920" filter="url(#grain)" pointer-events="none"/>
</svg>
<script>
/* Crayon (colored-pencil) engine, vertical 9:16, 1080x1920 (explainer-video skill).
   render(t) is deterministic. Kinds: draw (outline draws on, pencil fill fades in after), type (letters appear),
   pop (bubble scales in), drift (a mark floats up and fades), fade. Scenes cross-fade. */
const INK="#3b342e", NS="http://www.w3.org/2000/svg", SKIN="#f3d2bd", HAIR="#5a3b28";
const C={teal:"#7cc4b5",orange:"#f0a35e",purple:"#b9a3dc",green:"#9cc98a",navy:"#3f5a8c",pink:"#f2a7b5",yellow:"#f4cf5d",red:"#d9534f",lav:"#c9c3ec"};
const svg=document.getElementById("s"), stage=document.getElementById("stage"), rc=rough.svg(svg);
let EL=[], SC=[], SCN=[], cur=0, seed=3;
const so=(o={})=>Object.assign({seed:seed++,roughness:0.9,bowing:0.8,stroke:INK,strokeWidth:2.4},o);
const fo=(c,o={})=>so(Object.assign({fill:c,fillStyle:"hachure",hachureAngle:-38,hachureGap:3.6,fillWeight:1.7},o));
function scene(t){cur=SC.length; const g=document.createElementNS(NS,"g"); stage.appendChild(g); SC.push(g); SCN.push(t);}
function grp(){const g=document.createElementNS(NS,"g"); SC[cur].appendChild(g); return g;}
function draw(t0,dur,build,until=null){const g=grp(); build(n=>g.appendChild(n));
  const all=[...g.querySelectorAll("path")], P=all.filter(p=>p.getAttribute("stroke")&&p.getAttribute("stroke")!=="none"&&!p.closest("[data-fill]"));
  // rough.js puts fill strokes (hachure) as stroked paths inside the same <g>: treat the first path of each filled shape as fill
  const F=[...g.querySelectorAll("g")].flatMap(s=>{const ps=[...s.querySelectorAll(":scope>path")]; return ps.length>1&&s.dataset.filled?[ps[0]]:[]});
  const strokes=P.filter(p=>!F.includes(p)); const L=strokes.map(p=>p.getTotalLength());
  strokes.forEach((p,i)=>{p.style.strokeDasharray=L[i]+" "+L[i]; p.style.strokeLinecap="round";});
  EL.push({k:"draw",t0,dur,g,P:strokes,L,T:L.reduce((a,b)=>a+b,0)||1,F,until});}
// a filled rough shape: mark its <g> so draw() can separate the pencil fill from the outline
const filled=n=>{n.dataset.filled="1"; return n;};
function txt(x,y,s,size,color=INK,anchor="middle",bold=0){const tx=document.createElementNS(NS,"text"); tx.setAttribute("x",x); tx.setAttribute("y",y); tx.setAttribute("font-size",size); tx.setAttribute("fill",color); tx.setAttribute("text-anchor",anchor); tx.textContent=s;
  if(bold){tx.setAttribute("stroke",color); tx.setAttribute("stroke-width",bold); tx.setAttribute("paint-order","stroke");} return tx;}
function type(t0,dur,x,y,s,size,color=INK,anchor="middle",bold=0){const g=grp(); const tx=txt(x,y,"",size,color,anchor,bold); g.appendChild(tx); EL.push({k:"type",t0,dur,g,tx,s});}
function fade(t0,dur,x,y,s,size,color=INK,bold=0){const g=grp(); const tx=txt(x,y,s,size,color,"middle",bold); g.appendChild(tx); EL.push({k:"fade",t0,dur,g});}
function mv(keys,build,end=null){const g=grp(); build(n=>g.appendChild(n)); EL.push({k:"mv",keys,g,end});}
function wrap(s,n){const w=s.split(" "), L=[""]; w.forEach(x=>{if((L[L.length-1]+" "+x).trim().length>n) L.push(x); else L[L.length-1]=(L[L.length-1]+" "+x).trim();}); return L;}
function typeLines(t0,dur,s,y,size,n=34){const L=wrap(s,n), tot=s.length; let t=t0; L.forEach((l,i)=>{const d=dur*l.length/tot; type(t,d,540,y+i*size*1.25,l,size); t+=d;});}
function pop(t0,cx,cy,build){const g=grp(); const inner=document.createElementNS(NS,"g"); g.appendChild(inner); build(n=>inner.appendChild(n)); EL.push({k:"pop",t0,dur:0.4,g:inner,cx,cy,outer:g});}
function drift(t0,t1,x,y,dx,dy,s,size,color){const g=grp(); g.appendChild(txt(0,0,s,size,color,"middle",1.2)); EL.push({k:"drift",t0,t1,g,x,y,dx,dy});}
const ease=u=>u<0?0:u>1?1:u*u*(3-2*u), back=u=>{const c=1.7; u=Math.min(1,Math.max(0,u)); return 1+(c+1)*Math.pow(u-1,3)+c*Math.pow(u-1,2);};
function render(t){
  SCN.forEach((s,i)=>{const nx=i+1<SCN.length?SCN[i+1]:1e9; let o=0; if(t>=s-0.3&&t<nx+0.3){o=Math.min(1,(t-s+0.3)/0.6); if(t>nx-0.3) o=Math.max(0,(nx+0.3-t)/0.6);} if(i===0&&t<0.3) o=1; SC[i].style.opacity=o; SC[i].style.display=o>0?"":"none";});
  for(const e of EL){
    if(e.k==="draw"){const u=Math.max(0,Math.min(1,(t-e.t0)/e.dur)); e.g.style.opacity=u>0?(e.until!=null?1-ease((t-e.until)/0.3):1):0; let left=u*e.T;
      e.P.forEach((p,i)=>{const L=e.L[i], d=Math.max(0,Math.min(L,left)); left-=L; p.style.strokeDashoffset=L-d;});
      const f=ease((t-e.t0-e.dur*0.85)/0.45); e.F.forEach(p=>p.style.opacity=f);}
    else if(e.k==="type"){const u=Math.max(0,Math.min(1,(t-e.t0)/e.dur)); e.tx.textContent=e.s.slice(0,Math.round(u*e.s.length)); e.g.style.opacity=u>0?1:0;}
    else if(e.k==="mv"){const k=e.keys; if(t<k[0][0]||(e.end!=null&&t>=e.end)){e.g.style.opacity=0; continue;} e.g.style.opacity=1; let x=k[k.length-1][1], y=k[k.length-1][2];
      for(let i=0;i<k.length-1;i++) if(t<k[i+1][0]){const s=ease((t-k[i][0])/(k[i+1][0]-k[i][0])); x=k[i][1]+(k[i+1][1]-k[i][1])*s; y=k[i][2]+(k[i+1][2]-k[i][2])*s; break;}
      e.g.setAttribute("transform",`translate(${x},${y})`);}
    else if(e.k==="fade"){e.g.style.opacity=ease((t-e.t0)/e.dur);}
    else if(e.k==="pop"){const u=(t-e.t0)/e.dur; const s=u<=0?0:back(u); e.outer.style.opacity=u>0?1:0; e.g.setAttribute("transform",`translate(${e.cx},${e.cy}) scale(${Math.max(0.001,s)}) translate(${-e.cx},${-e.cy})`);}
    else if(e.k==="drift"){const u=(t-e.t0)/(e.t1-e.t0); const o=u<0||u>1?0:Math.min(1,u*4,(1-u)*3); const s=ease(u); e.g.style.opacity=o; e.g.setAttribute("transform",`translate(${e.x+e.dx*s},${e.y-e.dy*s})`);}
  }
}
/* ---------- figures ---------- */
function person(add,x,g,o){const hy=g-205;
  // legs
  if(o.dress){add(rc.line(x-10,g-72,x-10,g,so())); add(rc.line(x+10,g-72,x+10,g,so()));}
  else{add(filled(rc.polygon([[x-21,g-96],[x+21,g-96],[x+19,g],[x+3,g],[x,g-55],[x-3,g],[x-19,g]],fo(o.pants||C.navy))));}
  // body
  if(o.dress) add(filled(rc.polygon([[x-20,g-172],[x+20,g-172],[x+40,g-72],[x-40,g-72]],fo(o.dress))));
  else add(filled(rc.rectangle(x-22,g-172,44,80,fo(o.shirt))));
  // arms
  if(o.up){add(rc.line(x-20,g-165,x-48,g-255,so())); add(rc.line(x+20,g-165,x+48,g-255,so()));}
  else{add(rc.line(x-20,g-165,x-36,g-110,so())); add(rc.line(x+20,g-165,x+36,g-110,so()));}
  // head + hair + face
  add(filled(rc.circle(x,hy,62,fo(SKIN,{hachureGap:4.5,fillWeight:1.2}))));
  if(o.hair==="bun"){add(filled(rc.circle(x,hy-36,26,fo(HAIR)))); add(filled(rc.arc(x,hy-2,64,62,Math.PI,2*Math.PI,true,fo(HAIR))));}
  else if(o.hair==="long"){add(filled(rc.path(`M${x-31} ${hy+18} Q${x-36} ${hy-36} ${x} ${hy-33} Q${x+36} ${hy-36} ${x+31} ${hy+18} L${x+24} ${hy-8} Q${x} ${hy-22} ${x-24} ${hy-8} Z`,fo(o.hc||HAIR))));}
  else add(filled(rc.arc(x,hy-4,64,58,Math.PI,2*Math.PI,true,fo(o.hc||HAIR))));
  add(rc.arc(x-11,hy+3,12,8,Math.PI*1.1,Math.PI*1.9,false,so({strokeWidth:2}))); add(rc.arc(x+11,hy+3,12,8,Math.PI*1.1,Math.PI*1.9,false,so({strokeWidth:2})));
  add(rc.arc(x,hy+12,18,12,Math.PI*0.15,Math.PI*0.85,false,so({strokeWidth:2})));
  add(filled(rc.circle(x-18,hy+12,9,fo(C.pink,{stroke:"none",hachureGap:2.5})))); add(filled(rc.circle(x+18,hy+12,9,fo(C.pink,{stroke:"none",hachureGap:2.5}))));}
function robot(add,x,g,s,col){const w=78*s,h=62*s,top=g-190*s;
  add(rc.line(x-12*s,g-58*s,x-12*s,g,so())); add(rc.line(x+12*s,g-58*s,x+12*s,g,so()));
  add(filled(rc.rectangle(x-28*s,g-118*s,56*s,62*s,fo(col))));
  add(rc.line(x-28*s,g-108*s,x-46*s,g-75*s,so())); add(rc.line(x+28*s,g-108*s,x+46*s,g-75*s,so()));
  add(filled(rc.rectangle(x-w/2,top,w,h,fo("#e9e4f2",{hachureGap:5}))));
  add(rc.line(x,top,x,top-20*s,so())); add(filled(rc.circle(x,top-26*s,13*s,fo(C.red,{hachureGap:2.5}))));
  add(rc.circle(x-15*s,top+26*s,10*s,so())); add(rc.circle(x+15*s,top+26*s,10*s,so()));
  add(rc.arc(x,top+42*s,22*s,12*s,Math.PI*0.15,Math.PI*0.85,false,so({strokeWidth:2})));}
function bubble(add,x,y,w,h,tx,ty){add(filled(rc.ellipse(x,y,w,h,so({fill:"#fbf8f2",fillStyle:"solid"})))); add(rc.linearPath([[x-w*0.12,y+h*0.42],[tx,ty],[x+w*0.06,y+h*0.46]],so()));}
function sparkle(add,x,y,r,c){for(let i=0;i<4;i++){const a=i*Math.PI/4; add(rc.line(x-r*Math.cos(a),y-r*Math.sin(a),x+r*Math.cos(a),y+r*Math.sin(a),so({stroke:c,strokeWidth:3})));}}
/* ---------- scenes ----------
   timing.json (scripts/narrate.py, crayon preset): each scene has label (big word under the ground line, e.g. MONDAY),
   one spoken line seg[0] {t,d,text}; the caption types along with the voice. SCENE[i](s) draws scene i from its start s.
   Kinds: draw (outline draws on, pencil fill fades in), type, fade, pop (bubble), drift (floating mark), mv (moving drawing). */
let T=null; const G=1150;
function common(sc){const s=sc.start, g=sc.seg[0]; if(!sc.label) return;
  draw(s+0.1,0.6,add=>add(rc.line(110,G,970,G,so({strokeWidth:2.2}))));
  fade(s+0.2,0.5,540,1318,sc.label,104,INK,2.5);
  typeLines(g.t+0.05,Math.max(1.2,g.d*0.9),g.text,1392,46);}
const SCENE=[
 s=>{ // example 1: a team with a question
  [[260,{dress:C.teal,hair:"long"}],[440,{shirt:C.orange,pants:C.navy}],[620,{shirt:C.yellow,pants:C.navy,up:1}],[800,{dress:C.purple,hair:"bun"}]].forEach(([x,o],i)=>draw(s+0.4+i*0.25,0.6,add=>person(add,x,G,o)));
  pop(s+1.6,300,560,add=>bubble(add,300,560,300,100,280,640)); type(s+1.8,0.6,300,572,"Why?",40);
  [[560,1.8,C.red],[700,2.2,C.navy]].forEach(([x,t,c],i)=>drift(s+t,s+t+1.6,x,700,i?30:-25,220,"?",50,c));},
 s=>{ // example 2: a robot splits the job
  draw(s+0.4,0.8,add=>robot(add,540,800,1.25,C.lav)); fade(s+1.0,0.4,540,850,"Claude",38,C.navy,1);
  [[230,C.teal],[540,C.orange],[850,C.purple]].forEach(([x,c],i)=>{draw(s+1.3+i*0.4,0.6,add=>robot(add,x,G,0.8,c)); pop(s+1.9+i*0.4,x+55,G-160,add=>sparkle(add,x+55,G-160,14,C.yellow));});},
];
function build(timing){T=timing; EL=[]; SC=[]; SCN=[]; stage.innerHTML=""; seed=3;
 T.scenes.forEach((sc,i)=>{scene(sc.start); common(sc); (SCENE[i]||(()=>{}))(sc.start);});}
window.build=build; window.render=render;
</script></body></html>
